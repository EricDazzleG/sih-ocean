<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - INCOIS</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0B5677',
                        accent: '#2AB7B7',
                        danger: '#FF3B30',
                        warn: '#FF8C00',
                        sand: '#F5E9D6',
                        gold: '#C49A42',
                        text: '#0F172A',
                    }
                }
            }
        }
    </script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-white min-h-screen flex flex-col">
    <!-- Header Component -->
    <header id="header-container"></header>

    <!-- Emergency Notification Bar -->
    <div id="emergency-notification" class="bg-warn text-white p-3 text-center"></div>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4">
        <div class="bg-white rounded-lg shadow-md p-6 max-w-lg mx-auto">
            <h1 class="text-2xl font-bold text-primary mb-6">Submit a Report</h1>
            
            <form id="report-form" class="space-y-4">
                <!-- Location Input -->
                <div>
                    <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                    <div class="flex space-x-2">
                        <input type="text" id="location" name="location" class="flex-grow px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Enter location" required>
                        <button type="button" id="detect-location" class="bg-accent hover:bg-opacity-90 text-white px-3 py-2 rounded-md text-sm font-medium transition duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Tags Dropdown -->
                <div>
                    <label for="tag" class="block text-sm font-medium text-gray-700 mb-1">Report Type</label>
                    <select id="tag" name="tag" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="hazard">Hazard</option>
                        <option value="infrastructure">Infrastructure Issue</option>
                        <option value="misc">Miscellaneous</option>
                    </select>
                </div>
                
                <!-- Image/Video Upload -->
                <div>
                    <label for="media" class="block text-sm font-medium text-gray-700 mb-1">Upload Media (Optional)</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-md p-4 text-center">
                        <input type="file" id="media" name="media" class="hidden" accept="image/*,video/*">
                        <label for="media" class="cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                            <p class="mt-1 text-sm text-gray-500">Click to upload or drag and drop</p>
                            <p class="text-xs text-gray-400">Images or videos up to 10MB</p>
                        </label>
                        <div id="preview" class="mt-2 hidden">
                            <img id="image-preview" class="max-h-32 mx-auto hidden" alt="Preview">
                            <video id="video-preview" class="max-h-32 mx-auto hidden" controls></video>
                        </div>
                    </div>
                </div>
                
                <!-- Message Input -->
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message (Optional)</label>
                    <textarea id="message" name="message" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Provide additional details about your report"></textarea>
                </div>
                
                <!-- Submit Button -->
                <div>
                    <button type="submit" class="w-full bg-primary hover:bg-opacity-90 text-white font-bold py-3 px-4 rounded-md transition duration-300">
                        Submit Report
                    </button>
                </div>
            </form>
            
            <!-- Status Message -->
            <div id="status-message" class="mt-4 p-3 rounded-md hidden"></div>
        </div>
    </main>

    <!-- SOS Button -->
    <div id="sos-button-container"></div>

    <!-- Footer Component -->
    <footer id="footer-container"></footer>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- App Scripts -->
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/report.js"></script>
</body>
</html>
