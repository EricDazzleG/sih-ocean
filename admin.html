<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - INCOIS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0B5677',
              accent: '#2AB7B7',
              danger: '#FF3B30',
              warn: '#FF8C00',
              sand: '#F5E9D6',
              gold: '#C49A42',
              text: '#0F172A',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/incois-logo.svg" />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- Header -->
  <header id="header-container"></header>

  <!-- Emergency Notification Bar (hidden on admin) -->
  <div id="emergency-notification" class="hidden"></div>

  <main class="flex-grow container mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-primary">Admin Dashboard</h1>
      <div id="admin-user-pill" class="text-sm px-3 py-1 rounded-full bg-primary text-white hidden">Admin</div>
    </div>

    <!-- Filters -->
    <section class="bg-white rounded-lg shadow p-4 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Status</label>
          <select id="filter-status" class="w-full border rounded px-3 py-2">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="verified">Verified</option>
            <option value="rejected">Rejected</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Tag</label>
          <select id="filter-tag" class="w-full border rounded px-3 py-2">
            <option value="">All</option>
            <option value="hazard">Hazard</option>
            <option value="infrastructure">Infrastructure</option>
            <option value="misc">Misc</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Location</label>
          <input id="filter-location" placeholder="e.g., Kerala" class="w-full border rounded px-3 py-2" />
        </div>
        <div class="flex items-end gap-2">
          <button id="btn-apply-filters" class="px-4 py-2 bg-primary text-white rounded">Apply</button>
          <button id="btn-clear-filters" class="px-4 py-2 border rounded">Clear</button>
        </div>
      </div>
    </section>

    <!-- Main content: 2-column layout (Reports ~60%, Charts ~40%) -->
    <section class="grid grid-cols-1 md:grid-cols-12 gap-6">
      <!-- Left: Reports (~60%) -->
      <div class="md:col-span-7">
        <section class="bg-white rounded-lg shadow">
          <div class="p-4 border-b">
            <h2 class="font-semibold text-gray-700">Incoming Reports</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-gray-100 text-left">
                <tr>
                  <th class="px-4 py-3">Media</th>
                  <th class="px-4 py-3">Message</th>
                  <th class="px-4 py-3">Tag</th>
                  <th class="px-4 py-3">Location</th>
                  <th class="px-4 py-3">User</th>
                  <th class="px-4 py-3">Created</th>
                  <th class="px-4 py-3">Status</th>
                  <th class="px-4 py-3">Actions</th>
                </tr>
              </thead>
              <tbody id="reports-tbody"></tbody>
            </table>
          </div>
          <div id="admin-status" class="p-4 text-sm hidden"></div>
        </section>
      </div>

      <!-- Right: Charts (~40%), stacked -->
      <div class="md:col-span-5 flex flex-col gap-6">
        <div class="bg-white rounded-lg shadow p-4">
          <h2 class="font-semibold text-gray-700 mb-3">Reports by Status</h2>
          <canvas id="chart-status" height="220"></canvas>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
          <h2 class="font-semibold text-gray-700 mb-3">Reports by Tag</h2>
          <canvas id="chart-tag" height="220"></canvas>
        </div>
        <div class="bg-white rounded-lg shadow p-4">
          <h2 class="font-semibold text-gray-700 mb-3">Last 30 Days</h2>
          <canvas id="chart-time" height="220"></canvas>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer-container"></footer>

  <!-- Vendor libs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- App scripts -->
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
