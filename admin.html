<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - INCOIS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0B5677',
              accent: '#2AB7B7',
              danger: '#FF3B30',
              warn: '#FF8C00',
              sand: '#F5E9D6',
              gold: '#C49A42',
              text: '#0F172A',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="icon" type="image/svg+xml" href="./assets/incois-logo.svg" />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <!-- Header -->
  <header id="header-container"></header>

  <!-- Emergency Notification Bar (hidden on admin) -->
  <div id="emergency-notification" class="hidden"></div>

  <main class="flex-grow container mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-primary">Admin Dashboard</h1>
      <div id="admin-user-pill" class="text-sm px-3 py-1 rounded-full bg-primary text-white hidden">Admin</div>
    </div>

    <!-- Filters -->
    <section class="bg-white rounded-lg shadow p-4 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Status</label>
          <select id="filter-status" class="w-full border rounded px-3 py-2">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="verified">Verified</option>
            <option value="rejected">Rejected</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Tag</label>
          <select id="filter-tag" class="w-full border rounded px-3 py-2">
            <option value="">All</option>
            <option value="hazard">Hazard</option>
            <option value="infrastructure">Infrastructure</option>
            <option value="misc">Misc</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Location</label>
          <input id="filter-location" placeholder="e.g., Kerala" class="w-full border rounded px-3 py-2" />
        </div>
        <div class="flex items-end gap-2">
          <button id="btn-apply-filters" class="px-4 py-2 bg-primary text-white rounded">Apply</button>
          <button id="btn-clear-filters" class="px-4 py-2 border rounded">Clear</button>
        </div>
      </div>
    </section>

    <!-- Main content: 2-column layout (Reports ~60%, Charts ~40%) -->
    <section class="grid grid-cols-1 md:grid-cols-12 gap-6">
      <!-- Left: Reports (~60%) -->
      <div class="md:col-span-7">
        <section class="bg-white rounded-lg shadow">
          <div class="p-4 border-b">
            <h2 class="font-semibold text-gray-700">Incoming Reports</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-gray-100 text-left">
                <tr>
                  <th class="px-4 py-3">Media</th>
                  <th class="px-4 py-3">Message</th>
                  <th class="px-4 py-3">Tag</th>
                  <th class="px-4 py-3">Location</th>
                  <th class="px-4 py-3">User</th>
                  <th class="px-4 py-3">Created</th>
                  <th class="px-4 py-3">Status</th>
                  <th class="px-4 py-3">Actions</th>
                </tr>
              </thead>
              <tbody id="reports-tbody"></tbody>
            </table>
          </div>
          <div id="admin-status" class="p-4 text-sm hidden"></div>
        </section>
      </div>

      <!-- Right: 2x2 grid (~40%) -->
      <div class="md:col-span-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Top-left: Status chart -->
        <div class="bg-white rounded-lg shadow p-3">
          <h2 class="font-semibold text-gray-700 mb-2">Reports by Status</h2>
          <canvas id="chart-status" height="120"></canvas>
        </div>
        <!-- Top-right: Heatmap button card -->
        <div class="bg-white rounded-lg shadow p-3 flex items-center justify-center">
          <button id="btn-heatmap" class="inline-flex items-center gap-2 px-4 py-3 rounded bg-primary text-white text-sm shadow hover:bg-opacity-90">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"/></svg>
            Heatmap
          </button>
        </div>
        <!-- Bottom-left: Tag chart -->
        <div class="bg-white rounded-lg shadow p-3">
          <h2 class="font-semibold text-gray-700 mb-2">Reports by Tag</h2>
          <canvas id="chart-tag" height="120"></canvas>
        </div>
        <!-- Bottom-right: Time chart -->
        <div class="bg-white rounded-lg shadow p-3">
          <h2 class="font-semibold text-gray-700 mb-2">Last 30 Days</h2>
          <canvas id="chart-time" height="120"></canvas>
        </div>
      </div>
    </section>

    <!-- Tableau Dashboards (added) -->
    <section id="tableau-dashboards" class="mt-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Analytics (Tableau)</h2>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Tableau Dashboard 1 -->
        <div class="bg-white rounded-lg shadow p-3">
          <h3 class="font-medium text-gray-700 mb-2">Dashboard 1</h3>
          <div class="relative w-full" style="padding-top: 65%;">
            <iframe
              src="https://public.tableau.com/views/SIHProject2/Dashboard1?:showVizHome=no&:embed=y"
              class="absolute top-0 left-0 w-full h-full border-0"
              allowfullscreen
              title="Tableau Dashboard 1"
            ></iframe>
          </div>
        </div>

        <!-- Tableau Dashboard 2 -->
        <div class="bg-white rounded-lg shadow p-3">
          <h3 class="font-medium text-gray-700 mb-2">Dashboard 2</h3>
          <div class="relative w-full" style="padding-top: 65%;">
            <iframe
              src="https://public.tableau.com/views/SIHProject2/Dashboard2?:showVizHome=no&:embed=y"
              class="absolute top-0 left-0 w-full h-full border-0"
              allowfullscreen
              title="Tableau Dashboard 2"
            ></iframe>
          </div>
        </div>
      </div>
    </section>

    <!-- Sentiment Analysis (added) -->
    <section id="sentiment-analysis" class="mt-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Sentiment Analysis</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Image 1 -->
        <a href="./sentiment%20analysis/WhatsApp%20Image%202025-09-19%20at%2012.29.16_3d1a4150.jpg" target="_blank" class="block bg-white rounded-lg shadow overflow-hidden">
          <img
            src="./sentiment%20analysis/WhatsApp%20Image%202025-09-19%20at%2012.29.16_3d1a4150.jpg"
            alt="Sentiment analysis image 1"
            class="w-full h-80 object-contain bg-gray-50"
            loading="lazy"
          />
        </a>
        <!-- Image 2 -->
        <a href="./sentiment%20analysis/WhatsApp%20Image%202025-09-19%20at%2012.29.24_e0ae4355.jpg" target="_blank" class="block bg-white rounded-lg shadow overflow-hidden">
          <img
            src="./sentiment%20analysis/WhatsApp%20Image%202025-09-19%20at%2012.29.24_e0ae4355.jpg"
            alt="Sentiment analysis image 2"
            class="w-full h-80 object-contain bg-gray-50"
            loading="lazy"
          />
        </a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer id="footer-container"></footer>

  <!-- Vendor libs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- App scripts -->
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
