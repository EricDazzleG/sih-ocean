<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INCOIS - Indian National Centre for Ocean Information Services</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0B5677',
                        accent: '#2AB7B7',
                        danger: '#FF3B30',
                        warn: '#FF8C00',
                        sand: '#F5E9D6',
                        gold: '#C49A42',
                        text: '#0F172A',
                    }
                }
            }
        }
    </script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-white min-h-screen flex flex-col">
    <!-- Header Component -->
    <header id="header-container"></header>

    <!-- Emergency Notification Bar -->
    <div id="emergency-notification" class="bg-warn text-white p-3 text-center"></div>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4">
        <h1 class="text-2xl font-bold text-primary mb-6">Latest Reports</h1>
        
        <!-- Feed Section -->
        <div id="feed-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Reports will be loaded here dynamically -->
            <div class="animate-pulse bg-white rounded-lg p-4 shadow">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
            </div>
        </div>
    </main>

    <!-- SOS Button -->
    <div id="sos-button-container"></div>

    <!-- Footer Component -->
    <footer id="footer-container"></footer>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>

    <script>

        window.supabase = supabase.createClient(
            'https://uxculnxvfukuiczadoqz.supabase.co',

        );
    </script>
    
    <!-- App Scripts -->
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/home.js"></script>
    
    <!-- Error Handling -->
    <script>
        window.addEventListener('error', (event) => {
            console.error('Script error:', event);
            // Only show error if not already shown
            if (!document.getElementById('global-error-message')) {
                const errorContainer = document.createElement('div');
                errorContainer.id = 'global-error-message';
                errorContainer.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fef2f2; color: #dc2626; padding: 1rem; border-radius: 0.5rem; z-index: 1000; max-width: 90%; text-align: center;';
                errorContainer.textContent = 'Error loading application. Please check console for details.';
                document.body.appendChild(errorContainer);
                
                // Auto-remove after 10 seconds
                setTimeout(() => {
                    errorContainer.remove();
                }, 10000);
            }
        });
    </script>
</body>
</html>
