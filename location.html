<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location - INCOIS</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0B5677',
                        accent: '#2AB7B7',
                        danger: '#FF3B30',
                        warn: '#FF8C00',
                        sand: '#F5E9D6',
                        gold: '#C49A42',
                        text: '#0F172A',
                    }
                }
            }
        }
    </script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-white min-h-screen flex flex-col">
    <!-- Header Component -->
    <header id="header-container"></header>

    <!-- Emergency Notification Bar -->
    <div id="emergency-notification" class="bg-warn text-white p-3 text-center"></div>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4">
        <div class="bg-white rounded-lg shadow-md p-6 max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-primary mb-4">Location Map Preview</h1>
            
            <div class="border border-gray-300 rounded-lg overflow-hidden">
                <img
                  src="./493783_0_En_43-1_Fig6_HTML.png"
                  alt="Location preview"
                  class="w-full h-64 md:h-96 object-cover"
                  onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<div class=&quot;bg-gray-200 w-full h-64 md:h-96 flex items-center justify-center text-gray-600&quot;>Preview unavailable</div>')"
                />
            </div>
            
            <div class="mt-6">
                <h2 class="text-lg font-semibold text-primary mb-2">Your Location</h2>
                <div id="user-location" class="p-3 bg-gray-100 rounded-lg">
                    <p class="text-gray-700">Loading your location information...</p>
                </div>
            </div>
            
            <div class="mt-6">
                <h2 class="text-lg font-semibold text-primary mb-2">Nearby Alerts</h2>
                <div id="nearby-alerts" class="space-y-2">
                    <!-- Placeholder for alerts -->
                    <div class="animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SOS Button -->
    <div id="sos-button-container"></div>

    <!-- Footer Component -->
    <footer id="footer-container"></footer>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- App Scripts -->
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/location.js"></script>
</body>
</html>
